name: Build and Publish

on:
  push:
    branches: ['master', 'feat/**']
    paths-ignore: ['*.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Shared volumes and optical drives need an SDK newer than any published release, so the SDK is
  # built from this commit of the StartOS fork (the same source the start-cli below came from).
  STARTOS_REPO: sovsender/start-technologies
  STARTOS_REF: ec90d95043aaa1d25875e3ab104ea6822a420097
  START_CLI_URL: https://github.com/sovsender/makemkv-startos/releases/download/start-cli-optical/start-cli

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup build environment
        uses: Start9Labs/start-technologies/.github/actions/setup-build-env@master

      - uses: actions/checkout@v6

      - name: Install start-cli with opticalDrives support
        run: |
          curl -fsSL "$START_CLI_URL" -o /tmp/start-cli
          sudo install -m 755 /tmp/start-cli /usr/local/bin/start-cli
          start-cli --version

      - name: Provision signing keys
        env:
          DEV_KEY: ${{ secrets.DEV_KEY }}
        run: |
          mkdir -p ~/.startos .startos
          printf '%s' "$DEV_KEY" > ~/.startos/developer.key.pem
          cp ~/.startos/developer.key.pem .startos/build-key

      - name: Check out the StartOS source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.STARTOS_REPO }}
          ref: ${{ env.STARTOS_REF }}
          path: startos-src

      - name: Build the SDK from source
        run: |
          make -C "$GITHUB_WORKSPACE/startos-src/projects/start-sdk" bundle
          cd "$GITHUB_WORKSPACE/startos-src/projects/start-sdk"/dist
          npm pack --pack-destination /tmp
          ls -l /tmp/start9labs-start-sdk-*.tgz

      - name: Install package dependencies with that SDK
        run: |
          npm pkg set "dependencies.@start9labs/start-sdk=file:$(ls /tmp/start9labs-start-sdk-*.tgz)"
          npm install --no-package-lock
          node -p "require('@start9labs/start-sdk/package.json').version"

      - name: Build
        run: make x86

      - name: Check the manifest grants optical drives and shared volumes
        run: |
          start-cli s9pk inspect makemkv_x86_64.s9pk manifest | jq -e '.opticalDrives == true and .sharedVolumes == true'

      - uses: actions/upload-artifact@v7
        with:
          path: makemkv_x86_64.s9pk
          archive: false
          retention-days: 14

      # Only master releases and publishes; a feature branch just builds, for sideloading.
      - name: Release on GitHub
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(start-cli s9pk inspect makemkv_x86_64.s9pk manifest | jq -r .version)
          TAG="v${VERSION//:/_}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # Every release is a pre-release: it needs a development build of StartOS with optical
          # drive support and does not work on stock StartOS. Drop --prerelease only once that
          # feature ships in a StartOS release.
          NOTES="Pre-release. Requires a development build of StartOS with optical drive support (the opticalDrives manifest flag). It does not work on stock StartOS."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" makemkv_x86_64.s9pk --clobber
            gh release edit "$TAG" --prerelease
          else
            gh release create "$TAG" makemkv_x86_64.s9pk --target "$GITHUB_SHA" --title "$TAG" --notes "$NOTES" --prerelease
          fi

      - name: Publish to the registry
        if: github.ref == 'refs/heads/master'
        env:
          REGISTRY: ${{ vars.RELEASE_REGISTRY }}
        run: |
          VERSION=$(start-cli s9pk inspect makemkv_x86_64.s9pk manifest | jq -r .version)
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/makemkv_x86_64.s9pk"
          if EXISTING=$(start-cli --registry="$REGISTRY" registry package get makemkv --target-version="$VERSION" 2>/dev/null) && [ -n "$EXISTING" ]; then
            start-cli --registry="$REGISTRY" registry package remove makemkv "$VERSION"
          fi
          # Only an admin may create a package id or authorize a signer for it. Until the first
          # publish has been done by hand, the registry answers "Not Found: package.add", which is
          # a notice here rather than a red build; any other registry error still fails it.
          if ! OUT=$(start-cli --registry="$REGISTRY" registry package add makemkv_x86_64.s9pk --url "$URL" 2>&1); then
            if grep -q "Not Found: package.add" <<<"$OUT"; then
              echo "::notice::makemkv is not on $REGISTRY yet. Publish the first version with the admin key and authorize the CI signer; see AGENTS.local.md in the workspace."
              exit 0
            fi
            echo "$OUT" >&2
            exit 1
          fi
          echo "$OUT"
